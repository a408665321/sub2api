name: Community Release

on:
  push:
    tags:
      - 'v*-community.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing community release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: community-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TAG_NAME }}

      - name: Fetch maintained branch and tags
        run: |
          git fetch --no-tags origin \
            +refs/heads/custom/main:refs/remotes/origin/custom/main
          git fetch --tags --force origin

      - name: Validate community release
        run: |
          python3 tools/validate_community_release.py \
            --tag "$TAG_NAME" \
            --branch origin/custom/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Upload version file
        uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          if-no-files-found: error
          retention-days: 1

  release:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TAG_NAME }}

      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Download version file
        uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version | grep -q 'go1.27.0'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release and GHCR images
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --config=.goreleaser.community.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
